name: Storage Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  storage-tests:
    name: Storage tests (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run storage tests
        run: npm run test:storage

      - name: Build application
        run: npm run build
